baseURL = "https://mostakimsakib.me/"
theme = "mostakim"
paginate = 6
enableRobotsTXT = true
summaryLength = 24

timeZone = "Asia/Dhaka"

defaultContentLanguage = "en"

[languages]
  [languages.en]
    languageCode = "en-us"
    languageName = "English"
    title = "Mostakim Sakib"
    contentDir = "content"
    weight = 1

  [languages.bn]
    languageCode = "bn"
    languageName = "বাংলা"
    title = "মোস্তাকিম সাকিব"
    contentDir = "content/bn"
    weight = 2

[params]
  brandName = "Md. Mostakim Ahmed Sakib"
  shortName = "Mostakim Sakib"
  tagline = "Software Engineer | Product-minded developer | Tech writer"
  description = "Portfolio and publishing platform for Mostakim Sakib."
  accent = "#0ea5a5"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  blog = "/blog/:year/:month/:slug/"

[[menu.main]]
  name = "Home"
  url = "/"
  weight = 1

[[menu.main]]
  name = "About"
  url = "/about/"
  weight = 2

[[menu.main]]
  name = "Projects"
  url = "/projects/"
  weight = 3

[[menu.main]]
  name = "Blog"
  url = "/blog/"
  weight = 4

[[menu.main]]
  name = "Publications"
  url = "/publications/"
  weight = 5

[[menu.main]]
  name = "Achievements"
  url = "/achievements/"
  weight = 6

[[menu.main]]
  name = "Contact"
  url = "/contact/"
  weight = 7
