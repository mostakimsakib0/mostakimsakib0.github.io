baseURL = "https://mostakimsakib.me/"
theme = "mostakim"
paginate = 6
enableRobotsTXT = true
summaryLength = 24

timeZone = "Asia/Dhaka"

defaultContentLanguage = "en"
defaultContentLanguageInSubdir = false

[params]
  brandName = "Md. Mostakim Ahmed Sakib"
  shortName = "Mostakim Sakib"
  tagline = "Software Engineer | Product-minded developer | Tech writer"
  description = "Portfolio and publishing home of Mostakim Sakib."
  accent = "#0ea5a5"

[outputs]
  home = ["HTML", "RSS"]

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[permalinks]
  blog = "/blog/:year/:month/:slug/"

[languages]
  [languages.en]
    languageCode = "en-us"
    languageName = "English"
    title = "Mostakim Sakib"
    weight = 1
    contentDir = "content"

    [[languages.en.menu.main]]
      name = "Home"
      url = "/"
      weight = 1

    [[languages.en.menu.main]]
      name = "About"
      url = "/about/"
      weight = 2

    [[languages.en.menu.main]]
      name = "Projects"
      url = "/projects/"
      weight = 3

    [[languages.en.menu.main]]
      name = "Blog"
      url = "/blog/"
      weight = 4

    [[languages.en.menu.main]]
      name = "Publications"
      url = "/publications/"
      weight = 5

    [[languages.en.menu.main]]
      name = "Achievements"
      url = "/achievements/"
      weight = 6

    [[languages.en.menu.main]]
      name = "Contact"
      url = "/contact/"
      weight = 7

  [languages.bn]
    languageCode = "bn"
    languageName = "বাংলা"
    title = "Mostakim Sakib"
    weight = 2
    contentDir = "content/bn"

    [[languages.bn.menu.main]]
      name = "Home"
      url = "/bn/"
      weight = 1

    [[languages.bn.menu.main]]
      name = "About"
      url = "/bn/about/"
      weight = 2

    [[languages.bn.menu.main]]
      name = "Projects"
      url = "/bn/projects/"
      weight = 3

    [[languages.bn.menu.main]]
      name = "Blog"
      url = "/bn/blog/"
      weight = 4

    [[languages.bn.menu.main]]
      name = "Publications"
      url = "/bn/publications/"
      weight = 5

    [[languages.bn.menu.main]]
      name = "Achievements"
      url = "/bn/achievements/"
      weight = 6

    [[languages.bn.menu.main]]
      name = "Contact"
      url = "/bn/contact/"
      weight = 7
