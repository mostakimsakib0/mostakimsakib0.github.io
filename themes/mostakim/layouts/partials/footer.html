{{ $profile := .Site.Data.profile }}{{ if eq .Site.Language.Lang "bn" }}{{ with .Site.Data.bn.profile }}{{ $profile = . }}{{ end }}{{ end }}
<footer class="site-footer">
  <div class="container footer-inner">
    <div>
      <strong>{{ $profile.shortName }}</strong>
      <p class="meta">{{ $profile.availability }}</p>
    </div>
    <div class="footer-socials">
      {{ range $profile.socials }}
        <a href="{{ .url }}">{{ .label }}</a>
      {{ end }}
    </div>
    <p class="footer-copy">{{ now.Year }} © {{ $profile.shortName }}</p>
  </div>
</footer>
