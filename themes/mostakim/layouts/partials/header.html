{{ $profile := .Site.Data.profile }}
<header class="site-header">
  <div class="container header-inner">
    <a class="brand" href="/">
      <span class="brand-name">{{ $profile.shortName }}</span>
      <span class="brand-title">{{ $profile.title }}</span>
    </a>
    <nav class="site-nav" aria-label="Main navigation">
      {{ range .Site.Menus.main }}
        <a href="{{ .URL }}">{{ .Name }}</a>
      {{ end }}
    </nav>
    <button class="theme-toggle" id="theme-toggle" type="button" aria-label="Toggle color theme">
      <span class="toggle-indicator"></span>
      <span class="toggle-text">Theme</span>
    </button>
  </div>
</header>
