name: Translate and Build

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'tools/translate/**'
      - 'translate.config.json'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/translate/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix tools/translate

      - name: Restore translation cache
        uses: actions/cache@v3
        with:
          path: .translate-cache
          key: translate-cache-${{ hashFiles('content/**/*.md') }}
          restore-keys: translate-cache-

      - name: Run translation pipeline
        env:
          TRANSLATE_ENGINE: google
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: node tools/translate/index.js

      - name: Build Hugo site
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.7'
          extended: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
