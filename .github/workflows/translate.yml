name: Translate and Build

on:
  push:
    branches: [main]
    paths:
      - 'content/**/*.md'
      - 'tools/translate/**'
      - 'translate.config.json'
  workflow_dispatch:

jobs:
  translate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: tools/translate/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix tools/translate

      - name: Restore translation cache
        uses: actions/cache@v3
        with:
          path: .translate-cache
          key: translate-cache-${{ hashFiles('content/**/*.md') }}
          restore-keys: translate-cache-

      - name: Wake LibreTranslate (Render cold start)
        run: |
          echo "Waking LibreTranslate..."
          curl -s -o /dev/null -X POST "${{ secrets.LIBRE_TRANSLATE_URL }}/translate" \
            -H "Content-Type: application/json" \
            -d '{"q":"Hello","source":"en","target":"bn","format":"text"}' \
            --max-time 180 || echo "Wake-up failed, pipeline retry will handle it"

      - name: Warmup pause
        run: sleep 5

      - name: Run translation pipeline
        env:
          TRANSLATE_ENGINE: libretranslate
          LIBRE_TRANSLATE_URL: ${{ secrets.LIBRE_TRANSLATE_URL }}
        run: node tools/translate/index.js

      - name: Build Hugo site
        uses: peaceiris/actions-hugo@v2
        with:
          hugo-version: '0.123.7'
          extended: true

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        if: github.ref == 'refs/heads/main'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
